name: Test BGaming hard cases

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-bgaming-hard-cases.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: clash
            url: https://demo.bgaming-network.com/play/ClashofGodsAnubisvsHades/FUN
          - id: switchable
            url: https://demo.bgaming-network.com/play/AllLuckyClover/FUN

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium

      - name: Analyze
        run: |
          multiplay bgaming-analyze-demo "${{ matrix.url }}" \
            --output-dir "artifacts/${{ matrix.id }}" \
            --settle-ms 12000 \
            --timeout 30 \
            > "artifacts-${{ matrix.id }}.txt"
          cat "artifacts-${{ matrix.id }}.txt"

      - name: Assert hard-case progress
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          case = "${{ matrix.id }}"
          report = json.loads(
              Path("artifacts/${{ matrix.id }}/analysis.json").read_text()
          )
          print(json.dumps({
              "family": report.get("family"),
              "enrichment": report.get("enrichment"),
              "direct": report.get("direct_executable_count"),
              "children": report.get("switchable_children"),
              "routes": report.get("routes"),
          }, indent=2))

          if case == "clash":
              spin = [
                  r for r in report.get("routes") or []
                  if r.get("semantic") == "SPIN"
                  and r.get("status") == "NETWORK_OBSERVED"
                  and r.get("direct_executable")
              ]
              if not spin:
                  raise SystemExit("Clash spin is not observed/direct")
          else:
              children = report.get("switchable_children") or []
              if len(children) < 2 or not all(c.get("success") for c in children):
                  raise SystemExit("switchable children are not all validated")
              mapped = [
                  r for r in report.get("routes") or []
                  if r.get("child_identifier")
              ]
              if len(mapped) < 2:
                  raise SystemExit("switchable selectors were not mapped")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-hard-${{ matrix.id }}
          path: |
            artifacts/${{ matrix.id }}/analysis.json
            artifacts/${{ matrix.id }}/actions.json
            artifacts/${{ matrix.id }}/contract.har
            artifacts-${{ matrix.id }}.txt
          retention-days: 3
