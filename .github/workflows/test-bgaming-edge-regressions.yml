name: Test BGaming edge regressions

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-bgaming-edge-regressions.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: sweet-royale
            url: https://bgaming.com/games/sweet-royale-megaways
          - id: book-cats
            url: https://demo.bgaming-network.com/play/BookOfCatsMegaways/FUN

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium

      - name: Analyze
        run: |
          mkdir -p "artifacts/${{ matrix.id }}"
          multiplay bgaming-analyze-demo "${{ matrix.url }}"             --output-dir "artifacts/${{ matrix.id }}"             --settle-ms 12000             --timeout 30
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/${{ matrix.id }}")
          report = json.loads((root / "analysis.json").read_text())
          print("url:", report["url"])
          print("execution_url:", report.get("execution_url"))
          print("family:", report["family"])
          print("routes:", report["route_count"])
          print("direct:", report["direct_executable_count"])
          for route in report["routes"]:
              print(
                  route["semantic"],
                  route["status"],
                  "DIRECT" if route.get("direct_executable") else "-",
                  route["control"],
                  route.get("handler"),
                  route.get("wire_markers") or [],
              )

          if "${{ matrix.id }}" == "sweet-royale":
              if report.get("runtime_status") != "NO_RESOLVABLE_DEMO":
                  execution = report.get("execution_url") or ""
                  if "SweetRoyaleMegaways" not in execution:
                      raise SystemExit(f"wrong Sweet Royale runtime: {execution}")
                  if "MagicMummyMegaways" in execution:
                      raise SystemExit("Sweet Royale resolved to Magic Mummy")
                  if report["route_count"] < 1:
                      raise SystemExit("Sweet Royale exposed no routes")
              else:
                  if report.get("family") != "unresolved":
                      raise SystemExit("unresolved Sweet Royale has wrong family")

          if "${{ matrix.id }}" == "book-cats":
              purchases = [
                  route
                  for route in report["routes"]
                  if route.get("semantic") == "BUY_BONUS"
                  and route.get("interface_role") == "network_action"
              ]
              variants = {
                  marker.split("=", 1)[1]
                  for route in purchases
                  for marker in route.get("wire_markers") or []
                  if marker.startswith("purchased_feature=")
              }
              print("purchase variants:", sorted(variants))
              if not {"freespin_buy", "high_freespin_buy"} <= variants:
                  raise SystemExit("Book of Cats purchase variants were not separated")
              for route in purchases:
                  route_variants = [
                      marker
                      for marker in route.get("wire_markers") or []
                      if marker.startswith("purchased_feature=")
                  ]
                  if len(route_variants) != 1:
                      raise SystemExit(
                          f"ambiguous Book of Cats route: {route_variants}"
                      )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-edge-${{ matrix.id }}
          path: artifacts/${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 3
