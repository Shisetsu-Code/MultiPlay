name: Test BGaming HyperHive UI more

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-bgaming-hyper-ui-more.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: sweet-samurai
            url: https://demo.bgaming-network.com/play/SweetSamurai/FUN
          - id: yommi-rush
            url: https://demo.bgaming-network.com/play/YommiRush/FUN

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Analyze
        run: |
          mkdir -p "artifacts/${{ matrix.id }}"
          multiplay bgaming-analyze-demo "${{ matrix.url }}" \
            --output-dir "artifacts/${{ matrix.id }}" \
            --settle-ms 7000 \
            --timeout 25
      - name: Assert UI spin route
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/${{ matrix.id }}/analysis.json").read_text())
          print("family:",d.get("family"))
          print("routes:",d.get("route_count"))
          print("direct:",d.get("direct_executable_count"))
          for r in d.get("routes") or []:
              print(r.get("semantic"),r.get("interface_role"),r.get("status"),
                    "DIRECT" if r.get("direct_executable") else "-",
                    r.get("control"),r.get("handler"),r.get("wire_markers"))
          ui_spin=[
              r for r in d.get("routes") or []
              if r.get("semantic")=="SPIN"
              and r.get("interface_role")!="protocol_action"
              and r.get("status")=="NETWORK_OBSERVED"
              and r.get("direct_executable")
          ]
          if not ui_spin:
              raise SystemExit("no observed/direct UI spin route")
          PY
