name: BGaming HyperHive causal discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium

      - name: Fetch current BGaming catalog
        run: |
          mkdir -p artifacts/knowledge
          multiplay bgaming-catalog --output artifacts/catalog.json

      - name: Capture causal HyperHive browser evidence
        run: |
          multiplay bgaming-browser-discover \
            --catalog artifacts/catalog.json \
            --family hyperhive-jsonrpc \
            --output-dir artifacts/browser \
            --max-probes 120 \
            --probe-delay 1.0 \
            --timeout 30 \
            --max-clicks 40 \
            --settle-ms 4500 \
            --knowledge-root artifacts/knowledge \
            --output artifacts/result.json

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgaming-hyperhive-causal-discovery
          path: |
            artifacts/result.json
            artifacts/browser/selection.json
            artifacts/browser/analysis.json
            artifacts/browser/trace.json
            artifacts/browser/screenshots
            artifacts/knowledge
          if-no-files-found: warn
          retention-days: 7
