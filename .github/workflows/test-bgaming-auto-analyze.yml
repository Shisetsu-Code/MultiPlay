name: Test BGaming auto analyzer

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-bgaming-auto-analyze.yml"
      - "src/multiplay/providers/bgaming/auto_analyze.py"
      - "src/multiplay/action_graph.py"
      - "src/multiplay/har_map.py"
      - "src/multiplay/providers/bgaming/direct_port.py"
      - "src/multiplay/providers/bgaming/handler_probe.py"

permissions:
  contents: read

concurrency:
  group: bgaming-auto-analyzer
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: api-v2
            url: https://demo.bgaming-network.com/play/AlienFruits3/FUN
          - id: potion
            url: https://demo.bgaming-network.com/play/PotionSpells/FUN
          - id: hyperhive
            url: https://demo.bgaming-network.com/play/BigBucksSaloon/FUN

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium

      - name: Run one-shot analyzer
        run: |
          multiplay bgaming-analyze-demo "${{ matrix.url }}" \
            --output-dir "artifacts/${{ matrix.id }}" \
            --settle-ms 12000 \
            --timeout 30 \
            > "artifacts-${{ matrix.id }}.txt"
          cat "artifacts-${{ matrix.id }}.txt"

      - name: Verify sanitized outputs
        run: |
          test -f "artifacts/${{ matrix.id }}/analysis.json"
          test -f "artifacts/${{ matrix.id }}/actions.json"
          test -f "artifacts/${{ matrix.id }}/contract.har"
          test ! -f "artifacts/${{ matrix.id }}/browser.raw.har"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/${{ matrix.id }}")
          report = json.loads((root / "analysis.json").read_text())
          print("family:", report["family"])
          print("routes:", report["route_count"])
          print("direct:", report["direct_executable_count"])
          for route in report["routes"]:
              print(
                  route["semantic"],
                  route["interface_role"],
                  route["status"],
                  "DIRECT" if route.get("direct_executable") else "-",
                  route["control"],
                  route.get("wire_markers"),
              )

          contract = json.loads((root / "contract.har").read_text())
          sensitive = {"cookie", "authorization", "proxy-authorization", "x-api-key"}
          for entry in contract["log"]["entries"]:
              for side in ("request", "response"):
                  for header in (entry.get(side) or {}).get("headers") or []:
                      if str(header.get("name") or "").casefold() in sensitive:
                          if header.get("value") != "<redacted>":
                              raise SystemExit(
                                  f"raw sensitive header leaked: {header.get('name')}"
                              )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bgaming-auto-${{ matrix.id }}
          path: |
            artifacts/${{ matrix.id }}/analysis.json
            artifacts/${{ matrix.id }}/actions.json
            artifacts/${{ matrix.id }}/contract.har
            artifacts/${{ matrix.id }}/initial.jpg
            artifacts-${{ matrix.id }}.txt
          if-no-files-found: error
          retention-days: 3
