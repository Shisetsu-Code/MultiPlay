name: Test BGaming direct port

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-bgaming-direct-port.yml"
      - "src/multiplay/providers/bgaming/direct_port.py"
      - "src/multiplay/har_map.py"

permissions:
  contents: read

jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: api-v2
            url: https://demo.bgaming-network.com/play/AlienFruits3/FUN
          - id: legacy
            url: https://demo.bgaming-network.com/play/Catdiana/FUN
          - id: hyperhive
            url: https://demo.bgaming-network.com/play/BigBucksSaloon/FUN

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Execute direct fresh-session replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from multiplay.providers.bgaming.demo_spin import run_demo_base_spin
          from multiplay.providers.bgaming.direct_port import BGamingDemoDirectSession

          url = "${{ matrix.url }}"
          case = "${{ matrix.id }}"

          if case == "hyperhive":
              entries = [
                  {
                      "request": {
                          "method": "POST",
                          "url": "https://big-bucks-saloon.demo.bgaming-network.com/api",
                          "headers": [],
                          "postData": {
                              "mimeType": "application/json",
                              "text": json.dumps(
                                  {
                                      "id": 0,
                                      "jsonrpc": "2.0",
                                      "method": "init",
                                      "params": {"token": "captured"},
                                  }
                              ),
                          },
                      },
                      "response": {
                          "status": 200,
                          "headers": [],
                          "content": {
                              "mimeType": "application/json",
                              "text": json.dumps({"id": 0, "jsonrpc": "2.0", "result": {}}),
                          },
                      },
                  },
                  {
                      "request": {
                          "method": "POST",
                          "url": "https://big-bucks-saloon.demo.bgaming-network.com/api",
                          "headers": [],
                          "postData": {
                              "mimeType": "application/json",
                              "text": json.dumps(
                                  {
                                      "id": 0,
                                      "jsonrpc": "2.0",
                                      "method": "play",
                                      "params": {
                                          "req": {
                                              "bet": 40,
                                              "purchased_feature": "buy_bonus",
                                          },
                                          "state_lock": "captured-lock",
                                          "token": "captured",
                                      },
                                  }
                              ),
                          },
                      },
                      "response": {
                          "status": 200,
                          "headers": [],
                          "content": {
                              "mimeType": "application/json",
                              "text": json.dumps(
                                  {
                                      "id": 0,
                                      "jsonrpc": "2.0",
                                      "result": {"final": True, "state_lock": "next"},
                                  }
                              ),
                          },
                      },
                  },
              ]
          else:
              seed = run_demo_base_spin(url, timeout_s=30)
              entries = []
              for item in seed.evidence.http:
                  entries.append(
                      {
                          "request": {
                              "method": item.method,
                              "url": item.url,
                              "headers": [
                                  {"name": key, "value": value}
                                  for key, value in item.request_headers.items()
                              ],
                              "postData": {
                                  "mimeType": "application/json",
                                  "text": json.dumps(item.request_body),
                              },
                          },
                          "response": {
                              "status": item.response_status or 0,
                              "headers": [
                                  {"name": key, "value": value}
                                  for key, value in item.response_headers.items()
                              ],
                              "content": {
                                  "mimeType": "application/json",
                                  "text": json.dumps(item.response_body),
                              },
                          },
                      }
                  )

          har = Path("seed.har")
          har.write_text(
              json.dumps({"log": {"entries": entries}}),
              encoding="utf-8",
          )

          session = BGamingDemoDirectSession(
              har_path=har,
              url=url,
              timeout_s=30,
          )
          state = session.open()
          actions = session.actions()
          wanted = (
              "purchased_feature=buy_bonus"
              if case == "hyperhive"
              else "command=spin"
          )
          selected = next(
              action
              for action in actions
              if action.executable and wanted in action.wire_markers
          )
          result = session.execute(selected.action_id)

          inferred = None
          if case == "hyperhive":
              inferred_session = BGamingDemoDirectSession(
                  har_path=har,
                  url=url,
                  timeout_s=30,
              )
              inferred_session.open()
              inferred = inferred_session.execute_inferred_hyperhive(
                  ["method=play", "purchased_feature=buy_bonus"]
              )
              print("inferred:", json.dumps(inferred, indent=2))
              if not inferred.get("success"):
                  raise SystemExit("inferred HyperHive replay failed")

          print(
              json.dumps(
                  {
                      "case": case,
                      "family": state["family"],
                      "action": selected.to_dict(),
                      "result_status": result["status"],
                      "request": result["request"],
                      "inferred": inferred,
                  },
                  indent=2,
              )
          )
          if not 200 <= result["status"] < 400:
              raise SystemExit("direct replay failed")
          PY
