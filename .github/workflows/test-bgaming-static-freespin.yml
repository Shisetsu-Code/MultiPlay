name: Test BGaming recovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-bgaming-static-freespin.yml"
      - "src/multiplay/action_graph.py"
      - "src/multiplay/har_map.py"
      - "src/multiplay/providers/bgaming/direct_port.py"
      - "src/multiplay/providers/bgaming/demo_spin.py"
      - "src/multiplay/providers/bgaming/auto_analyze.py"
      - "src/multiplay/providers/bgaming/handler_probe.py"
      - "tests/test_action_graph.py"
      - "tests/test_har_map.py"
      - "tests/test_bgaming_direct_port.py"
      - "tests/test_bgaming_demo_spin.py"
      - "tests/test_bgaming_auto_analyze.py"

permissions:
  contents: write

concurrency:
  group: bgaming-api-v2-recovery
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: >-
          pytest -q
          tests/test_bgaming_direct_port.py
          tests/test_bgaming_auto_analyze.py
          tests/test_bgaming_demo_spin.py
          tests/test_action_graph.py
          tests/test_har_map.py

  analyze:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: big-atlantis-frenzy
            url: https://demo.bgaming-network.com/play/BigAtlantisFrenzy/FUN?server=demo
          - id: big-boat-big-catch
            url: https://demo.bgaming-network.com/play/BigTunaBonanza/FUN?server=demo
          - id: derby-rush
            url: https://demo.bgaming-network.com/play/DerbyRush/FUN?server=demo
          - id: maneki-88-gold
            url: https://demo.bgaming-network.com/play/Maneki88Gold/FUN?server=demo
          - id: multi-rush
            url: https://demo.bgaming-network.com/play/MultiRush/FUN
          - id: jewel-boom-super-drop
            url: https://demo.bgaming-network.com/play/JewelBoom/FUN
          - id: yommi-rush
            url: https://demo.bgaming-network.com/play/YommiRush/FUN
          - id: rocket-eruption-triple-blast
            url: https://demo.bgaming-network.com/play/RocketEruptionTripleBlast/FUN
          - id: joker-vs-joker
            url: https://demo.bgaming-network.com/play/JokerVsJoker/FUN

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Analyze
        run: |
          mkdir -p "artifacts/${{ matrix.id }}"
          multiplay bgaming-analyze-demo "${{ matrix.url }}" \
            --output-dir "artifacts/${{ matrix.id }}" \
            --settle-ms 7000 \
            --timeout 25
      - name: Summarize
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/${{ matrix.id }}/analysis.json").read_text())
          print("family:", d.get("family"))
          print("enrichment:", json.dumps(d.get("enrichment"), ensure_ascii=False))
          print("direct:", d.get("direct_executable_count"))
          print("blockers:", d.get("blockers"))
          print("handler_probe:", json.dumps(d.get("handler_probe"), ensure_ascii=False))
          for r in d.get("routes") or []:
              if r.get("semantic") in {"SPIN","BUY_BONUS","FREESPIN","CHANCE"}:
                  print(
                      r.get("semantic"),
                      r.get("status"),
                      "DIRECT" if r.get("direct_executable") else "-",
                      r.get("control"),
                      r.get("handler"),
                      r.get("wire_markers") or [],
                  )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-recovery-${{ matrix.id }}
          path: artifacts/${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 3


  aggregate:
    needs: [unit, analyze]
    if: always() && needs.unit.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: bgaming-recovery-*
          path: downloaded
          merge-multiple: false
      - name: Build compact recovery result
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          games = []
          for path in sorted(Path("downloaded").rglob("analysis.json")):
              try:
                  d = json.loads(path.read_text())
              except Exception as exc:
                  games.append({"path": str(path), "error": f"{type(exc).__name__}: {exc}"})
                  continue

              routes = d.get("routes") or []
              interesting = []
              for r in routes:
                  if r.get("semantic") not in {"SPIN", "BUY_BONUS", "FREESPIN", "CHANCE"}:
                      continue
                  interesting.append({
                      "semantic": r.get("semantic"),
                      "status": r.get("status"),
                      "control": r.get("control"),
                      "handler": r.get("handler"),
                      "wire_markers": r.get("wire_markers") or [],
                      "direct_executable": bool(r.get("direct_executable")),
                      "direct_reason": r.get("direct_reason") or "",
                  })

              games.append({
                  "id": path.parent.name,
                  "family": d.get("family"),
                  "enrichment": d.get("enrichment"),
                  "direct_executable_count": d.get("direct_executable_count"),
                  "blockers": d.get("blockers") or [],
                  "handler_probe": d.get("handler_probe"),
                  "routes": interesting,
              })

          doc = {
              "schema": "multiplay/bgaming-recovery-test/v1",
              "run_id": os.environ["RUN_ID"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "games": games,
          }
          out = Path("knowledge/providers/bgaming/recovery-last.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(doc, ensure_ascii=False, indent=2))
          PY
      - name: Persist recovery result
        run: |
          cp knowledge/providers/bgaming/recovery-last.json /tmp/recovery-last.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p knowledge/providers/bgaming
          cp /tmp/recovery-last.json knowledge/providers/bgaming/recovery-last.json
          git config user.name "MultiPlay Worker"
          git config user.email "multiplay-worker@users.noreply.github.com"
          git add knowledge/providers/bgaming/recovery-last.json
          if git diff --cached --quiet; then
            echo "No recovery changes"
            exit 0
          fi
          git commit -m "Update BGaming recovery results"
          git push origin HEAD:main
