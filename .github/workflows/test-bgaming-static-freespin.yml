name: Test BGaming API-v2 recovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-bgaming-static-freespin.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_bgaming_direct_port.py tests/test_bgaming_auto_analyze.py

  analyze:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: big-atlantis-frenzy
            url: https://demo.bgaming-network.com/play/BigAtlantisFrenzy/FUN?server=demo
          - id: big-boat-big-catch
            url: https://demo.bgaming-network.com/play/BigTunaBonanza/FUN?server=demo
          - id: derby-rush
            url: https://demo.bgaming-network.com/play/DerbyRush/FUN?server=demo
          - id: maneki-88-gold
            url: https://demo.bgaming-network.com/play/Maneki88Gold/FUN?server=demo

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Analyze
        run: |
          mkdir -p "artifacts/${{ matrix.id }}"
          multiplay bgaming-analyze-demo "${{ matrix.url }}" \
            --output-dir "artifacts/${{ matrix.id }}" \
            --settle-ms 7000 \
            --timeout 25
      - name: Summarize
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/${{ matrix.id }}/analysis.json").read_text())
          print("family:", d.get("family"))
          print("enrichment:", json.dumps(d.get("enrichment"), ensure_ascii=False))
          print("direct:", d.get("direct_executable_count"))
          print("blockers:", d.get("blockers"))
          print("handler_probe:", json.dumps(d.get("handler_probe"), ensure_ascii=False))
          for r in d.get("routes") or []:
              if r.get("semantic") in {"SPIN","BUY_BONUS","FREESPIN","CHANCE"}:
                  print(
                      r.get("semantic"),
                      r.get("status"),
                      "DIRECT" if r.get("direct_executable") else "-",
                      r.get("control"),
                      r.get("handler"),
                      r.get("wire_markers") or [],
                  )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-recovery-${{ matrix.id }}
          path: artifacts/${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 3
