name: Probe final BGaming 7RST

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-bgaming-final-7rst.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Validate final 7RST contracts
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          from multiplay.providers.bgaming.auto_analyze import analyze_bgaming_demo

          root = Path("final-7rst")
          root.mkdir(parents=True, exist_ok=True)

          urls = {
              "grand-patron": "https://demo.bgaming-network.com/play/GrandPatron7rst/FUN",
              "keepers-of-the-secret": (
                  "https://demo.bgaming-network.com/play/KeepersOfTheSecret7rst/FUN"
              ),
          }

          reports = {}
          for slug, url in urls.items():
              reports[slug] = analyze_bgaming_demo(
                  url,
                  output_dir=root / slug,
                  settle_ms=9000,
                  timeout_s=30,
                  keep_raw_har=False,
                  screenshot=False,
              )

          grand = reports["grand-patron"]
          keepers = reports["keepers-of-the-secret"]

          def static_routes(report):
              return {
                  str(row.get("route_id") or ""): row
                  for row in report.get("routes") or []
                  if str(row.get("route_id") or "").startswith("static-hyperhive:")
              }

          grand_routes = static_routes(grand)
          keepers_routes = static_routes(keepers)
          expected_grand = {
              "static-hyperhive:spin",
              "static-hyperhive:shop",
              "static-hyperhive:shop2",
              "static-hyperhive:shop3",
              "static-hyperhive:ante",
          }

          summary = {
              "grand_patron": {
                  "family": grand.get("family"),
                  "static_profile": grand.get("static_profile"),
                  "direct_session": grand.get("direct_session"),
                  "direct_executable_count": grand.get("direct_executable_count"),
                  "static_routes": list(grand_routes.values()),
                  "blockers": grand.get("blockers"),
              },
              "keepers_of_the_secret": {
                  "family": keepers.get("family"),
                  "static_profile": keepers.get("static_profile"),
                  "direct_session": keepers.get("direct_session"),
                  "direct_executable_count": keepers.get("direct_executable_count"),
                  "static_routes": list(keepers_routes.values()),
                  "blockers": keepers.get("blockers"),
              },
          }
          (root / "report.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          if set(grand_routes) != expected_grand:
              raise SystemExit(
                  "Grand Patron did not expose the expected base + 4 economic routes"
              )
          if not all(
              bool(grand_routes[route_id].get("direct_executable"))
              for route_id in expected_grand
          ):
              raise SystemExit("Grand Patron 7RST routes did not all validate")
          grand_endpoint = str((grand.get("direct_session") or {}).get("endpoint") or "")
          if not grand_endpoint.endswith("/api/api"):
              raise SystemExit(f"Grand Patron used unexpected endpoint: {grand_endpoint}")

          keepers_spin = keepers_routes.get("static-hyperhive:spin")
          if not keepers_spin or not keepers_spin.get("direct_executable"):
              raise SystemExit("Keepers of the Secret base spin did not validate")
          if len(keepers_routes) != 1:
              raise SystemExit("Keepers unexpectedly exposed economic routes")
          keepers_endpoint = str(
              (keepers.get("direct_session") or {}).get("endpoint") or ""
          )
          if not keepers_endpoint.endswith("/api/api"):
              raise SystemExit(f"Keepers used unexpected endpoint: {keepers_endpoint}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-final-7rst
          path: final-7rst
          retention-days: 7
