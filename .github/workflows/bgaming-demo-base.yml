name: BGaming demo base wire

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bgaming-demo-base.yml"

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: api-v2-alien-fruits-3
            url: https://demo.bgaming-network.com/play/AlienFruits3/FUN?server=demo
          - id: legacy-catdiana
            url: https://demo.bgaming-network.com/play/Catdiana/FUN?server=demo

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Execute one demo base spin
        run: |
          mkdir -p artifacts/knowledge
          multiplay bgaming-demo-spin \
            "${{ matrix.url }}" \
            --timeout 30 \
            --knowledge-root artifacts/knowledge \
            --output "artifacts/${{ matrix.id }}.json"

      - name: Show result
        if: always()
        run: |
          if [ -f "artifacts/${{ matrix.id }}.json" ]; then
            cat "artifacts/${{ matrix.id }}.json"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgaming-demo-${{ matrix.id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 7
