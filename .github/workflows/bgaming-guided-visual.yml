name: BGaming guided visual probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bgaming-guided-visual.yml"

permissions:
  contents: read

jobs:
  guided:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium

      - name: Probe visually selected game controls
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          from multiplay.browser.explorer import image_change_ratio

          out = Path("artifacts")
          controls = [
              ("jackpot-spins-label", 480.0, 250.0),
              ("colossal-spins-label", 720.0, 250.0),
              ("hold-n-win-spins-label", 960.0, 250.0),
              ("top-left-b", 35.0, 42.0),
              ("info", 75.0, 835.0),
              ("settings", 112.0, 835.0),
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  viewport={"width": 1440, "height": 900},
                  device_scale_factor=1,
              )
              page = context.new_page()
              page.goto(
                  "https://demo.bgaming-network.com/play/BlingBlitzDiamondDrop/FUN",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(25000)
              page.mouse.click(504.0, 453.0)
              page.wait_for_timeout(10000)

              # Reproduce the visually verified PLAY sequence from the successful run.
              page.mouse.click(600.0, 680.0)
              page.wait_for_timeout(2500)
              page.mouse.click(668.5, 675.0)
              page.wait_for_timeout(5000)

              game = page.screenshot(
                  path=str(out / "00-game.jpg"),
                  type="jpeg",
                  quality=65,
              )

              opened = False
              for index, (name, x, y) in enumerate(controls, start=1):
                  page.mouse.click(x, y)
                  page.wait_for_timeout(2200)
                  current = page.screenshot(
                      path=str(out / f"{index:02d}-{name}.jpg"),
                      type="jpeg",
                      quality=65,
                  )
                  ratio = image_change_ratio(game, current)
                  print(f"CONTROL {name}: ({x}, {y}) change={ratio:.6f}")
                  if ratio >= 0.08:
                      opened = True
                      print(f"OPENED {name}")
                      break

              print(f"opened={opened}")
              context.close()
              browser.close()
          PY

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgaming-guided-controls
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
