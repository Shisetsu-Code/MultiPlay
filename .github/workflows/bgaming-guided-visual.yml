name: BGaming guided visual probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bgaming-guided-visual.yml"

permissions:
  contents: read

jobs:
  guided:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium

      - name: Run screenshot-guided feature branches
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          branches = [
              ("left", 480.0, 165.0),
              ("center", 720.0, 165.0),
              ("right", 960.0, 165.0),
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              for name, feature_x, feature_y in branches:
                  out = Path("artifacts") / name
                  out.mkdir(parents=True, exist_ok=True)

                  context = browser.new_context(
                      viewport={"width": 1440, "height": 900},
                      device_scale_factor=1,
                  )
                  page = context.new_page()
                  page.goto(
                      "https://demo.bgaming-network.com/play/BlingBlitzDiamondDrop/FUN",
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  # The right-hand run previously still showed the loading splash at 12 s.
                  page.wait_for_timeout(25000)
                  page.screenshot(
                      path=str(out / "00-before-audio-click.jpg"),
                      type="jpeg",
                      quality=65,
                  )

                  # Visual center of the red X in the audio prompt.
                  page.mouse.click(504.0, 453.0)
                  page.wait_for_timeout(1800)
                  page.screenshot(
                      path=str(out / "01-after-audio.jpg"),
                      type="jpeg",
                      quality=65,
                  )

                  # Visual center of the PLAY button.
                  page.mouse.click(720.0, 690.0)
                  page.wait_for_timeout(8000)
                  page.screenshot(
                      path=str(out / "02-after-play.jpg"),
                      type="jpeg",
                      quality=65,
                  )

                  # One of the three feature chests visible on the current game screen.
                  page.mouse.click(feature_x, feature_y)
                  page.wait_for_timeout(2500)
                  page.screenshot(
                      path=str(out / "03-after-feature.jpg"),
                      type="jpeg",
                      quality=65,
                  )

                  context.close()

              browser.close()
          PY

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgaming-guided-visual
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
