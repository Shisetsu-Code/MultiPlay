name: BGaming guided visual probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bgaming-guided-visual.yml"

permissions:
  contents: read

jobs:
  guided:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium

      - name: Probe visually selected PLAY points
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          from multiplay.browser.explorer import image_change_ratio

          out = Path("artifacts")
          play_points = [
              (600.0, 680.0),
              (668.5, 675.0),
              (720.0, 690.0),
              (775.0, 680.0),
              (840.0, 690.0),
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  viewport={"width": 1440, "height": 900},
                  device_scale_factor=1,
              )
              page = context.new_page()
              page.goto(
                  "https://demo.bgaming-network.com/play/BlingBlitzDiamondDrop/FUN",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(25000)
              page.screenshot(
                  path=str(out / "00-audio.jpg"),
                  type="jpeg",
                  quality=65,
              )

              page.mouse.click(504.0, 453.0)
              page.wait_for_timeout(10000)
              baseline = page.screenshot(
                  path=str(out / "01-play-screen.jpg"),
                  type="jpeg",
                  quality=65,
              )

              entered = False
              for index, (x, y) in enumerate(play_points, start=1):
                  page.mouse.click(x, y)
                  page.wait_for_timeout(2500)
                  current = page.screenshot(
                      path=str(out / f"play-{index:02d}-{int(x)}-{int(y)}.jpg"),
                      type="jpeg",
                      quality=65,
                  )
                  ratio = image_change_ratio(baseline, current)
                  print(f"PLAY point {index}: ({x}, {y}) change={ratio:.6f}")
                  if ratio >= 0.12:
                      entered = True
                      break

              if entered:
                  page.wait_for_timeout(3500)
                  page.screenshot(
                      path=str(out / "10-game.jpg"),
                      type="jpeg",
                      quality=65,
                  )
                  # Left feature chest, selected directly from the current game screenshot.
                  page.mouse.click(480.0, 165.0)
                  page.wait_for_timeout(2500)
                  page.screenshot(
                      path=str(out / "11-left-feature.jpg"),
                      type="jpeg",
                      quality=65,
                  )

              context.close()
              browser.close()
          PY

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgaming-guided-play
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
