name: tmp-yggdrasil-probe
on:
  push:
    paths: ['.github/workflows/tmp-yggdrasil-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Reach live game canvas
        env:
          TARGET_URL: 'https://yggdrasilgaming.com/games/vikings-go-to-hollywood-wildfight-rushingwilds#tryit'
        run: |
          cat > /tmp/reach.py <<'PY'
          import asyncio, os, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright
          O=Path("ygg-probe4");O.mkdir(exist_ok=True)
          ev=[]
          def cl(s):
            if not s:return s
            return re.sub(r'(?i)(token|session|sid|jwt|auth|key)=([^&\s]+)',r'\1=<redacted>',s)[:10000]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={"width":1440,"height":1000})
              pg=await c.new_page()
              pg.on("request",lambda r: ev.append({"method":r.method,"url":cl(r.url),"type":r.resource_type,"post":cl(r.post_data if r.method!="GET" else None)}) if r.resource_type in ("xhr","fetch","websocket","document") else None)
              await pg.goto(os.environ["TARGET_URL"],wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(2000)
              for t in ["ACCEPT COOKIES","YES, I AM OVER 18"]:
                try:
                  q=pg.get_by_text(t,exact=False)
                  if await q.count(): await q.first.click(timeout=3000)
                except: pass
              try:
                q=pg.get_by_text("PLAY",exact=True)
                if await q.count(): await q.first.click(timeout=4000)
              except: pass
              await pg.wait_for_timeout(9000)
              gf=next(f for f in pg.frames if "staticdemo.yggdrasilgaming.com/10964/" in f.url)
              for i in range(18):
                try: await gf.locator("body").click(position={"x":400,"y":515},force=True)
                except: pass
                await pg.wait_for_timeout(1800)
                if i in (4,8,12,17):
                  try: await gf.locator("body").screenshot(path=str(O/f"stage-{i}.png"))
                  except: pass
              await pg.wait_for_timeout(5000)
              await gf.locator("body").screenshot(path=str(O/"final.png"))
              svc=[e for e in ev if "demo.yggdrasilgaming.com/game.web/service" in e["url"]]
              (O/"service.json").write_text(json.dumps(svc,indent=2),encoding="utf-8")
              print(json.dumps(svc[-20:],indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/reach.py
      - uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-probe4
          path: ygg-probe4
