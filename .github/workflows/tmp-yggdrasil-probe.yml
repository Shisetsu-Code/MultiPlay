name: tmp-yggdrasil-probe
on:
  push:
    paths: ['.github/workflows/tmp-yggdrasil-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Enter real Yggdrasil game
        env:
          TARGET_URL: 'https://yggdrasilgaming.com/games/vikings-go-to-hollywood-wildfight-rushingwilds#tryit'
        run: |
          cat > /tmp/enter.py <<'PY'
          import asyncio, os, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright
          O=Path("ygg-probe5");O.mkdir(exist_ok=True)
          ev=[]
          def cl(s):
            if not s:return s
            return re.sub(r'(?i)(token|session|sid|jwt|auth|key)=([^&\s]+)',r'\1=<redacted>',s)[:12000]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={"width":1440,"height":1000})
              pg=await c.new_page()
              pg.on("request",lambda r: ev.append({"method":r.method,"url":cl(r.url),"type":r.resource_type,"post":cl(r.post_data if r.method!="GET" else None)}) if r.resource_type in ("xhr","fetch","websocket","document") else None)
              await pg.goto(os.environ["TARGET_URL"],wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(2000)
              for t in ["ACCEPT COOKIES","YES, I AM OVER 18"]:
                try:
                  q=pg.get_by_text(t,exact=False)
                  if await q.count(): await q.first.click(timeout=3000)
                except: pass
              try:
                q=pg.get_by_text("PLAY",exact=True)
                if await q.count(): await q.first.click(timeout=4000)
              except: pass
              await pg.wait_for_timeout(12000)
              gf=next(f for f in pg.frames if "staticdemo.yggdrasilgaming.com/10964/" in f.url)
              # click actual rendered CONTINUE coordinates; repeat until splash exits
              for i in range(12):
                try: await gf.locator("body").click(position={"x":648,"y":624},force=True)
                except: pass
                await pg.wait_for_timeout(2000)
              await pg.wait_for_timeout(5000)
              await gf.locator("body").screenshot(path=str(O/"game.png"))
              # broad coarse scan along lower/side UI, recording service calls
              pts=[]
              for y in [430,480,530,580,640]:
                for x in [50,120,200,280,360,440,520,600,680,760,840,920,1000,1080,1160,1240]:
                  pts.append((x,y))
              hits=[]
              for x,y in pts:
                before=len(ev)
                try: await gf.locator("body").click(position={"x":x,"y":y},force=True)
                except: continue
                await pg.wait_for_timeout(350)
                ds=[e for e in ev[before:] if "demo.yggdrasilgaming.com/game.web/service" in e["url"]]
                if ds:
                  hits.append({"x":x,"y":y,"events":ds})
                  try: await gf.locator("body").screenshot(path=str(O/f"hit-{x}-{y}.png"))
                  except: pass
              (O/"hits.json").write_text(json.dumps(hits,indent=2),encoding="utf-8")
              (O/"service.json").write_text(json.dumps([e for e in ev if "demo.yggdrasilgaming.com/game.web/service" in e["url"]],indent=2),encoding="utf-8")
              print("=== HITS ===")
              print(json.dumps(hits,indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/enter.py
      - uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-probe5
          path: ygg-probe5
