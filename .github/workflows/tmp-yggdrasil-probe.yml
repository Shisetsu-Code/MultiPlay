name: tmp-yggdrasil-probe

on:
  push:
    paths:
      - '.github/workflows/tmp-yggdrasil-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Probe in-game purchase controls
        env:
          TARGET_URL: 'https://yggdrasilgaming.com/games/vikings-go-to-hollywood-wildfight-rushingwilds#tryit'
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio, json, os, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT=Path('ygg-probe2'); OUT.mkdir(exist_ok=True)
          events=[]
          def clean(s):
              if not s: return s
              s=re.sub(r'(?i)(token|session|sid|jwt|auth|key)=([^&\\s]+)',r'\\1=<redacted>',s)
              return s[:12000]

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  c=await b.new_context(viewport={'width':1440,'height':1000})
                  page=await c.new_page()
                  page.on('request', lambda req: events.append({
                      'method':req.method,'url':clean(req.url),'type':req.resource_type,
                      'post':clean(req.post_data if req.method!='GET' else None)
                  }) if req.resource_type in ('xhr','fetch','websocket','document') else None)
                  await page.goto(os.environ['TARGET_URL'],wait_until='domcontentloaded',timeout=90000)
                  await page.wait_for_timeout(2500)
                  for txt in ['ACCEPT COOKIES','YES, I AM OVER 18','Yes, I am over 18']:
                      try:
                          q=page.get_by_text(txt,exact=False)
                          if await q.count(): await q.first.click(timeout=3000)
                      except: pass
                  try:
                      q=page.get_by_text('PLAY',exact=True)
                      if await q.count(): await q.first.click(timeout=4000)
                  except: pass
                  await page.wait_for_timeout(9000)

                  game=None
                  for f in page.frames:
                      if 'staticdemo.yggdrasilgaming.com/10964/' in f.url:
                          game=f; break
                  if not game:
                      raise RuntimeError('game frame not found')

                  # click splash/start in center
                  try:
                      await game.locator('body').click(position={'x':400,'y':300},force=True,timeout=5000)
                  except Exception:
                      pass
                  await page.wait_for_timeout(4500)

                  # snapshot DOM buttons/text
                  dom=await game.evaluate("""() => [...document.querySelectorAll('button,[role=button],a,div,span')].map(e=>{const r=e.getBoundingClientRect(); const t=(e.innerText||e.textContent||'').trim(); return {tag:e.tagName,cls:e.className,text:t.slice(0,180),x:r.x,y:r.y,w:r.width,h:r.height,vis:!!(r.width&&r.height)};}).filter(x=>x.vis && x.text).slice(0,1500)""")
                  (OUT/'dom.json').write_text(json.dumps(dom,indent=2),encoding='utf-8')
                  try: await game.locator('body').screenshot(path=str(OUT/'game-ready.png'))
                  except: pass

                  # probe likely UI zones on 800x600 game coordinates.
                  pts=[
                    ('left-mid',70,300),('left-low',70,430),('left-bottom',70,520),
                    ('bottom-left',160,540),('bottom-mid',400,545),
                    ('right-low',710,430),('right-bottom',720,520),
                    ('buy-likely-1',120,420),('buy-likely-2',120,480),
                    ('modal-left',280,360),('modal-mid',400,360),('modal-right',520,360),
                    ('modal-confirm',400,470)
                  ]
                  clicks=[]
                  for name,x,y in pts:
                      before=len(events)
                      try:
                          await game.locator('body').click(position={'x':x,'y':y},force=True,timeout=3000)
                          await page.wait_for_timeout(1800)
                          clicks.append({'name':name,'x':x,'y':y,'delta':events[before:]})
                          try: await game.locator('body').screenshot(path=str(OUT/f'{name}.png'))
                          except: pass
                      except Exception as e:
                          clicks.append({'name':name,'x':x,'y':y,'error':str(e)[:300]})

                  (OUT/'clicks.json').write_text(json.dumps(clicks,indent=2),encoding='utf-8')
                  api=[e for e in events if 'demo.yggdrasilgaming.com/game.web/service' in e.get('url','')]
                  (OUT/'api.json').write_text(json.dumps(api,indent=2),encoding='utf-8')
                  print('=== DOM BUY MATCHES ===')
                  print(json.dumps([x for x in dom if re.search(r'buy|bonus|free spin|feature',x['text'],re.I)],indent=2))
                  print('=== API EVENTS ===')
                  print(json.dumps(api,indent=2))
                  print('=== CLICK API DELTAS ===')
                  for cl in clicks:
                      ds=[e for e in cl.get('delta',[]) if 'demo.yggdrasilgaming.com/game.web/service' in e.get('url','')]
                      if ds: print(json.dumps({'click':cl['name'],'events':ds},indent=2))
                  await b.close()
          asyncio.run(main())
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-probe2
          path: ygg-probe2
