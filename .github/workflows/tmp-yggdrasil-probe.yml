name: tmp-yggdrasil-probe
on:
  push:
    paths: ['.github/workflows/tmp-yggdrasil-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture both Yggdrasil bonus purchases
        env:
          TARGET_URL: 'https://yggdrasilgaming.com/games/vikings-go-to-hollywood-wildfight-rushingwilds#tryit'
        run: |
          cat > /tmp/two.py <<'PY'
          import asyncio,os,json,re
          from pathlib import Path
          from playwright.async_api import async_playwright
          O=Path("ygg-probe7");O.mkdir(exist_ok=True)
          def clean(s):
            if not s:return s
            return re.sub(r'(?i)(token|session|sid|jwt|auth|key)=([^&\s]+)',r'\1=<redacted>',s)[:16000]

          async def one(browser,label,buy_y):
            ev=[]
            c=await browser.new_context(viewport={"width":1440,"height":1000})
            pg=await c.new_page()
            pg.on("request",lambda r: ev.append({"method":r.method,"url":clean(r.url),"type":r.resource_type,"post":clean(r.post_data if r.method!="GET" else None)}) if r.resource_type in ("xhr","fetch","websocket","document") else None)
            await pg.goto(os.environ["TARGET_URL"],wait_until="domcontentloaded",timeout=90000)
            await pg.wait_for_timeout(2000)
            for t in ["ACCEPT COOKIES","YES, I AM OVER 18"]:
              try:
                q=pg.get_by_text(t,exact=False)
                if await q.count(): await q.first.click(timeout=3000)
              except: pass
            try:
              q=pg.get_by_text("PLAY",exact=True)
              if await q.count(): await q.first.click(timeout=4000)
            except: pass
            await pg.wait_for_timeout(17000)
            gf=next(f for f in pg.frames if "staticdemo.yggdrasilgaming.com/10964/" in f.url)
            for _ in range(5):
              try: await gf.locator("body").click(position={"x":648,"y":624},force=True)
              except: pass
              await pg.wait_for_timeout(1600)
            await pg.wait_for_timeout(5000)
            # close collection modal and open buy dialog
            await gf.locator("body").click(position={"x":648,"y":550},force=True)
            await pg.wait_for_timeout(1200)
            await gf.locator("body").click(position={"x":1210,"y":575},force=True)
            await pg.wait_for_timeout(1200)
            before=len(ev)
            await gf.locator("body").click(position={"x":785,"y":buy_y},force=True)
            await pg.wait_for_timeout(1800)
            await gf.locator("body").screenshot(path=str(O/f"{label}-after-buy.png"))
            d1=ev[before:]
            # confirmation candidate: center-lower and center
            causal1=[e for e in d1 if "demo.yggdrasilgaming.com" in e["url"] and e["type"] in ("xhr","fetch")]
            before2=len(ev)
            for x,y in [(648,555),(648,600),(785,555),(785,600)]:
              await gf.locator("body").click(position={"x":x,"y":y},force=True)
              await pg.wait_for_timeout(800)
            await pg.wait_for_timeout(1500)
            await gf.locator("body").screenshot(path=str(O/f"{label}-after-confirm.png"))
            d2=ev[before2:]
            causal2=[e for e in d2 if "demo.yggdrasilgaming.com" in e["url"] and e["type"] in ("xhr","fetch")]
            out={"label":label,"buy_click_events":causal1,"confirm_events":causal2}
            (O/f"{label}.json").write_text(json.dumps(out,indent=2),encoding="utf-8")
            print("=== "+label+" ===")
            print(json.dumps(out,indent=2))
            await c.close()
            return out

          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              a=await one(b,"upper-390",325)
              b2=await one(b,"lower-65",532)
              (O/"combined.json").write_text(json.dumps([a,b2],indent=2),encoding="utf-8")
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/two.py
      - uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-probe7
          path: ygg-probe7
