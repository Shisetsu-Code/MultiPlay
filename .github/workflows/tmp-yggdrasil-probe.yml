name: tmp-yggdrasil-probe
on:
  push:
    paths: ['.github/workflows/tmp-yggdrasil-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Enter game and probe buy bonus
        env:
          TARGET_URL: 'https://yggdrasilgaming.com/games/vikings-go-to-hollywood-wildfight-rushingwilds#tryit'
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio, json, os, re
          from pathlib import Path
          from playwright.async_api import async_playwright
          O=Path("ygg-probe3");O.mkdir(exist_ok=True)
          ev=[]
          def cl(s):
            if not s:return s
            return re.sub(r'(?i)(token|session|sid|jwt|auth|key)=([^&\s]+)',r'\1=<redacted>',s)[:12000]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={"width":1440,"height":1000})
              pg=await c.new_page()
              pg.on("request",lambda r: ev.append({"method":r.method,"url":cl(r.url),"type":r.resource_type,"post":cl(r.post_data if r.method!="GET" else None)}) if r.resource_type in ("xhr","fetch","websocket","document") else None)
              await pg.goto(os.environ["TARGET_URL"],wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(2000)
              for t in ["ACCEPT COOKIES","YES, I AM OVER 18"]:
                try:
                  q=pg.get_by_text(t,exact=False)
                  if await q.count(): await q.first.click(timeout=3000)
                except: pass
              try:
                q=pg.get_by_text("PLAY",exact=True)
                if await q.count(): await q.first.click(timeout=4000)
              except: pass
              await pg.wait_for_timeout(17000)
              gf=next(f for f in pg.frames if "staticdemo.yggdrasilgaming.com/10964/" in f.url)
              # click CONTINUE accurately in 800x600 canvas
              await gf.locator("body").click(position={"x":400,"y":515},force=True)
              await pg.wait_for_timeout(6000)
              await gf.locator("body").screenshot(path=str(O/"after-continue.png"))
              # probe likely buy-button zones in main game, one click at a time; capture only causal service requests
              pts=[
                ("bl1",55,505),("bl2",95,505),("bl3",145,505),("bl4",195,505),
                ("left1",55,430),("left2",100,430),("left3",145,430),
                ("rb1",610,505),("rb2",665,505),("rb3",720,505),("rb4",765,505),
                ("midlow1",260,520),("midlow2",320,520),("midlow3",480,520),("midlow4",540,520)
              ]
              results=[]
              for n,x,y in pts:
                before=len(ev)
                await gf.locator("body").click(position={"x":x,"y":y},force=True)
                await pg.wait_for_timeout(900)
                ds=[e for e in ev[before:] if "demo.yggdrasilgaming.com/game.web/service" in e["url"]]
                results.append({"name":n,"x":x,"y":y,"api":ds})
                if ds:
                  await gf.locator("body").screenshot(path=str(O/f"hit-{n}.png"))
              (O/"results.json").write_text(json.dumps(results,indent=2),encoding="utf-8")
              (O/"api-all.json").write_text(json.dumps([e for e in ev if "demo.yggdrasilgaming.com/game.web/service" in e["url"]],indent=2),encoding="utf-8")
              print("=== RESULTS ===")
              print(json.dumps([x for x in results if x["api"]],indent=2))
              print("=== ALL SERVICE ===")
              print(json.dumps([e for e in ev if "demo.yggdrasilgaming.com/game.web/service" in e["url"]],indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-probe3
          path: ygg-probe3
