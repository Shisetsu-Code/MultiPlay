name: Test 5 random BGaming games

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-bgaming-random-five.yml"

permissions:
  contents: read

concurrency:
  group: bgaming-random-five
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -e .

      - id: pick
        name: Pick five current games
        run: |
          multiplay bgaming-catalog --output catalog.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import random
          from pathlib import Path

          payload = json.loads(Path("catalog.json").read_text())
          records = payload.get("records") if isinstance(payload, dict) else payload
          records = [r for r in records if isinstance(r, dict)]

          excluded = {
              "forgotten",
              "rotating element",
              "golden avalon hold and win",
              "lucky pack: 2026 cup",
              "gift rush",
              "potion spells",
              "hot chilli bells 100",
              "stars & stripes hold and win",
              "book of pyramids",
              "rocket eruption: triple blast",
              "alien fruits 3",
              "big bucks saloon",
              "catdiana",
          }

          candidates = []
          for item in records:
              name = str(item.get("name") or item.get("slug") or "game")
              if name.strip().casefold() in excluded:
                  continue
              url = (
                  item.get("execution_url")
                  or item.get("demo_url")
                  or item.get("public_url")
                  or ""
              )
              if not url:
                  continue
              candidates.append(
                  {
                      "id": str(item.get("slug") or "game"),
                      "name": name,
                      "url": str(url),
                  }
              )

          picked = random.SystemRandom().sample(candidates, 5)
          print("matrix=" + json.dumps({"include": picked}, separators=(",", ":")))
          PY

  analyze:
    needs: sample
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sample.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium

      - name: Analyze one game
        env:
          GAME_NAME: ${{ matrix.name }}
          GAME_ID: ${{ matrix.id }}
          GAME_URL: ${{ matrix.url }}
        run: |
          mkdir -p "artifacts/$GAME_ID"
          set +e
          multiplay bgaming-analyze-demo "$GAME_URL" \
            --output-dir "artifacts/$GAME_ID" \
            --settle-ms 12000 \
            --timeout 30 \
            > "artifacts/$GAME_ID/stdout.txt" \
            2> "artifacts/$GAME_ID/stderr.txt"
          RC=$?
          set -e
          echo "$RC" > "artifacts/$GAME_ID/returncode.txt"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts") / os.environ["GAME_ID"]
          analysis = root / "analysis.json"
          if analysis.exists():
              report = json.loads(analysis.read_text())
              print("name:", os.environ["GAME_NAME"])
              print("slug:", os.environ["GAME_ID"])
              print("family:", report.get("family"))
              print("routes:", report.get("route_count", 0))
              print("direct:", report.get("direct_executable_count", 0))
              for blocker in report.get("blockers") or []:
                  print("blocker:", blocker)
              for route in report.get("routes") or []:
                  print(
                      route.get("semantic"),
                      route.get("interface_role"),
                      route.get("status"),
                      "DIRECT" if route.get("direct_executable") else "-",
                      route.get("control"),
                      route.get("wire_markers") or [],
                  )
          else:
              print("name:", os.environ["GAME_NAME"])
              print("slug:", os.environ["GAME_ID"])
              print("analysis.json missing")
              stderr = root / "stderr.txt"
              if stderr.exists():
                  print(stderr.read_text()[-3000:])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bgaming-random-${{ matrix.id }}
          path: artifacts/${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 3
