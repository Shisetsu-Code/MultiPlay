name: Test BGaming level purchases

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-bgaming-level-purchases.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: aztec-clusters
            url: https://demo.bgaming-network.com/play/AztecClusters/FUN?server=demo
          - id: book-of-kemet
            url: https://demo.bgaming-network.com/play/BookOfKemet/FUN?server=demo
          - id: maneki-88-gold
            url: https://demo.bgaming-network.com/play/Maneki88Gold/FUN?server=demo
          - id: diamond-of-jungle
            url: https://demo.bgaming-network.com/play/DiamondOfJungle/FUN?server=demo

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[browser,dev]"
      - run: python -m playwright install --with-deps chromium

      - name: Analyze
        run: |
          mkdir -p "artifacts/${{ matrix.id }}"
          multiplay bgaming-analyze-demo "${{ matrix.url }}" \
            --output-dir "artifacts/${{ matrix.id }}" \
            --settle-ms 7000 \
            --timeout 25

      - name: Summarize
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/${{ matrix.id }}/analysis.json")
          d = json.loads(p.read_text())
          print("family:", d.get("family"))
          print("routes:", d.get("route_count"))
          print("direct:", d.get("direct_executable_count"))
          for r in d.get("routes") or []:
              if r.get("semantic") in {"SPIN","BUY_BONUS","FREESPIN"}:
                  print(
                      r.get("semantic"),
                      r.get("status"),
                      "DIRECT" if r.get("direct_executable") else "-",
                      r.get("control"),
                      r.get("wire_markers") or [],
                  )
          PY
