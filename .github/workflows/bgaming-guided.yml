name: BGaming guided click

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bgaming-guided.yml"

permissions:
  contents: read

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Click top visual element
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.goto(
                  "https://demo.bgaming-network.com/play/BlingBlitzDiamondDrop/FUN",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )
              page.wait_for_timeout(10000)

              page.mouse.click(505, 455)
              page.wait_for_timeout(3000)

              target = max(
                  [f for f in page.frames if "bling-blitz-diamond-drop.demo.bgaming-network.com" in f.url],
                  key=lambda f: len(f.url),
              )
              print("frame:", target.url)
              print("elements:", target.evaluate("""() => document.elementsFromPoint(720, 690).map((el, i) => ({
                  i,
                  tag: el.tagName,
                  id: el.id || '',
                  cls: el.className || '',
                  pointer: getComputedStyle(el).pointerEvents,
                  z: getComputedStyle(el).zIndex
              }))"""))

              page.screenshot(path="artifacts/before.jpg", type="jpeg", quality=65)

              target.evaluate("""() => {
                  const x = 720, y = 690;
                  const el = document.elementFromPoint(x, y);
                  if (!el) throw new Error('No element at PLAY');
                  for (const type of ['pointermove','pointerdown','mousedown','pointerup','mouseup','click']) {
                    const Ctor = type.startsWith('pointer') ? PointerEvent : MouseEvent;
                    el.dispatchEvent(new Ctor(type, {
                      bubbles: true,
                      cancelable: true,
                      clientX: x,
                      clientY: y,
                      button: 0,
                      buttons: type.includes('down') ? 1 : 0
                    }));
                  }
              }""")

              page.wait_for_timeout(5000)
              page.screenshot(path="artifacts/after.jpg", type="jpeg", quality=65)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bgaming-guided-step
          path: artifacts
          if-no-files-found: error
          retention-days: 2
