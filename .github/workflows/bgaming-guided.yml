name: BGaming guided click

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bgaming-guided.yml"

permissions:
  contents: read

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Test visible PLAY hit area
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          points = [
              ("left", 600, 690),
              ("center", 720, 690),
              ("right", 840, 690),
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              for name, x, y in points:
                  context = browser.new_context(viewport={"width": 1440, "height": 900})
                  page = context.new_page()
                  page.goto(
                      "https://demo.bgaming-network.com/play/BlingBlitzDiamondDrop/FUN",
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )
                  page.wait_for_timeout(10000)
                  page.mouse.click(505, 455)
                  page.wait_for_timeout(3000)
                  page.mouse.click(x, y)
                  page.wait_for_timeout(5000)
                  page.screenshot(
                      path=f"artifacts/{name}.jpg",
                      type="jpeg",
                      quality=65,
                  )
                  context.close()

              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bgaming-guided-step
          path: artifacts
          if-no-files-found: error
          retention-days: 2
