name: BGaming guided click

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bgaming-guided.yml"

permissions:
  contents: read

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Confirm audio then PLAY
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.goto(
                  "https://demo.bgaming-network.com/play/BlingBlitzDiamondDrop/FUN",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )
              page.wait_for_timeout(12000)
              page.screenshot(path="artifacts/00-audio.jpg", type="jpeg", quality=65)

              page.mouse.click(940, 455)
              page.wait_for_timeout(4000)
              page.screenshot(path="artifacts/01-audio-confirmed.jpg", type="jpeg", quality=65)

              page.mouse.click(720, 690)
              page.wait_for_timeout(6000)
              page.screenshot(path="artifacts/02-after-play.jpg", type="jpeg", quality=65)

              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bgaming-guided-step
          path: artifacts
          if-no-files-found: error
          retention-days: 2
