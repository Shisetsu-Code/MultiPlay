name: BGaming guided click

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bgaming-guided.yml"

permissions:
  contents: read

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify PLAY input
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.goto(
                  "https://demo.bgaming-network.com/play/BlingBlitzDiamondDrop/FUN",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )
              page.wait_for_timeout(10000)
              page.mouse.click(505, 455)
              page.wait_for_timeout(3000)

              inner = next(
                  f for f in page.frames
                  if "bling-blitz-diamond-drop.demo.bgaming-network.com/?token=" in f.url
              )
              info = inner.evaluate("""() => {
                  const c = document.elementFromPoint(720, 690);
                  window.__guidedEvents = [];
                  for (const type of ['pointermove','pointerdown','mousedown','pointerup','mouseup','click']) {
                    c.addEventListener(type, e => {
                      window.__guidedEvents.push({
                        type,
                        clientX: e.clientX,
                        clientY: e.clientY,
                        offsetX: e.offsetX,
                        offsetY: e.offsetY,
                        trusted: e.isTrusted
                      });
                    }, true);
                  }
                  const r = c.getBoundingClientRect();
                  return {
                    tag: c.tagName,
                    width: c.width || null,
                    height: c.height || null,
                    rect: {x:r.x,y:r.y,width:r.width,height:r.height}
                  };
              }""")
              print("canvas-info:", info)

              page.mouse.move(720, 690, steps=6)
              page.wait_for_timeout(200)
              page.mouse.down()
              page.wait_for_timeout(150)
              page.mouse.up()
              page.wait_for_timeout(1000)

              events = inner.evaluate("() => window.__guidedEvents")
              print("input-events:", events)
              page.screenshot(path="artifacts/after.jpg", type="jpeg", quality=65)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bgaming-guided-step
          path: artifacts
          if-no-files-found: error
          retention-days: 2
